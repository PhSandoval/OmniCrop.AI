name: CI Pipeline

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  test_and_coverage:
    name: "🧪 Pytest & 100% Coverage Gate"
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Clonar repositório
        uses: actions/checkout@v4

      - name: 🐍 Configurar Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: 📦 Instalar Dependências
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pytest-cov

      - name: 🚀 Executar Testes com Cobertura Estrita (100% Core Coverage)
        env:
          PYTHONPATH: .
          SUPABASE_URL: "https://mock.supabase.co"
          SUPABASE_KEY: "mock-key-for-ci"
          AZURE_CONNECTION_STRING: "DefaultEndpointsProtocol=https;AccountName=mock;AccountKey=mockkey;EndpointSuffix=core.windows.net"
        run: |
          pytest --cov=src --cov=scripts --cov-fail-under=100 -v
