name: Ingestão Diária - Azure Blob Storage & MLOps

on:
  schedule:
    # Roda todos os dias às 4:00 AM UTC (1:00 AM horário de Brasília)
    - cron: '0 4 * * *'
  
  # A opção workflow_dispatch permite que você clique em um botão no GitHub para rodar na hora que quiser!
  workflow_dispatch:

jobs:
  ingestao_dados_e_mlops:
    runs-on: ubuntu-latest
    
    steps:
      - name: 📥 Clonar o repositório
        uses: actions/checkout@v4

      - name: 🐍 Configurar Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: 📦 Instalar Bibliotecas
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: 📡 Simular Telemetria de Sensores IoT (Fase 3 - Bronze)
        env:
          AZURE_CONNECTION_STRING: ${{ secrets.AZURE_CONNECTION_STRING }}
        run: |
          python scripts/simulate_iot_sensors.py --days 1 --talhao talhao_01

      - name: 🚀 Executar Ingestão Azure (Bronze -> Silver -> Data Drift Audit -> Gold)
        # Executa a esteira Medallion com auditoria de Data Drift entre Silver e Gold
        env:
          AZURE_CONNECTION_STRING: ${{ secrets.AZURE_CONNECTION_STRING }}
          ALERT_WEBHOOK_URL: ${{ secrets.ALERT_WEBHOOK_URL }}
        run: |
          python src/data/ingest_azure.py
