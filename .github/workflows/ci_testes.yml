name: Testes de Ingestão de Dados

# Quando este script deve rodar?
on:
  push:
    branches: [ "main" ] # Roda sempre que você fizer um push para a main
  pull_request:
    branches: [ "main" ]

jobs:
  testes_python:
    runs-on: ubuntu-latest # O GitHub vai ligar uma máquina Linux

    steps:
    - name: Baixando o código do repositório
      uses: actions/checkout@v3

    - name: Configurando o Python 3.10
      uses: actions/setup-python@v4
      with:
        python-version: "3.10" # Coloque a versão que você está usando localmente
        
    - name: Instalando as dependências
      run: |
        python -m pip install --upgrade pip
        pip install pytest requests python-dotenv pandas
        # Se você tiver um requirements.txt, é só trocar a linha de cima por: pip install -r requirements.txt

    - name: Rodando os testes com Pytest
      run: |
        pytest tests/