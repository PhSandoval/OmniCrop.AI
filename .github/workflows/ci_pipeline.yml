name: Integração Contínua (CI)

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  mlops_test_pyramid:
    name: "🧪 ${{ matrix.test_layer }}"
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - test_layer: "Contratos e Nuvem (Data)"
            path: "tests/test_data.py"
          - test_layer: "Fronteiras Matemáticas (Modelo)"
            path: "tests/test_model.py"
          - test_layer: "Engenharia de Variáveis (Features)"
            path: "tests/test_features.py"
          - test_layer: "Regras de Decisão (DSS)"
            path: "tests/test_dss.py"
          - test_layer: "Navegação e Estado (UI)"
            path: "tests/test_ui.py"

    steps:
    - name: 📥 Clonar repositório
      uses: actions/checkout@v4

    - name: 🐍 Configurar Python 3.10
      uses: actions/setup-python@v5
      with:
        python-version: "3.10"
        cache: 'pip'

    - name: 📦 Instalar Dependências
      run: |
        python -m pip install --upgrade pip
        pip install pytest pytest-cov
        pip install -r requirements.txt

    - name: 🚀 Executar ${{ matrix.test_layer }}
      run: |
        pytest ${{ matrix.path }} -v
