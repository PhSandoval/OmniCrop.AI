[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "omnicrop"
version = "1.0.0"
description = "OmniCrop AI - Enterprise Precision Agriculture & MLOps System"
authors = [{ name = "OmniCrop Engineering Team" }]
readme = "README.md"
requires-python = ">=3.10"

[project.optional-dependencies]
dev = [
    # Testes e Cobertura
    "pytest>=7.0.0",
    "pytest-cov>=5.0.0",
    # API Headless (FastAPI)
    "fastapi>=0.110.0",
    "uvicorn>=0.28.0",
    "httpx>=0.27.0",
    # Cache distribuído
    "redis>=5.0.0",
    # Model Registry HF
    "huggingface-hub>=0.20.0",
    # Auditoria de Vulnerabilidades (SCA)
    "pip-audit>=2.8.0",
    # Versões exatas para compatibilidade com API e testes
    "pydantic==2.13.5",
    "pydantic_core==2.46.5",
    "scikit-learn==1.7.2",
]
spark = [
    # Pipelines de Big Data distribuídos (Databricks, EMR, Dataproc, Synapse)
    # Não instalar no Streamlit Cloud — o projeto usa Pandas + PyArrow nativamente
    "pyspark>=3.5.0",
    "delta-spark>=3.0.0",
    "pyarrow>=14.0.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
filterwarnings = [
    "ignore::FutureWarning",
    "ignore::RuntimeWarning",
    "ignore::DeprecationWarning",
]

[tool.coverage.run]
source = ["src", "infra"]
omit = [
    "pages/*",
    "app.py",
    "src/ui/*",
    "src/models/train_all_crops.py",
    "infra/train_all_crops.py",
    "src/pipelines/spark/silver_pipeline.py",
    "src/pipelines/spark/gold_batch_job.py",
    "src/pipelines/spark/spark_session.py",
    "tests/*",
]

[tool.coverage.report]
show_missing = true
precision = 1
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "if __name__ == .__main__.:",
    "raise AssertionError",
    "raise NotImplementedError",
    "if TYPE_CHECKING:",
]
